<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="346" viewBox="0 0 1000 346" role="img" aria-label="Terraform + Ansible: The Handoff">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#4338ca"/></linearGradient><radialGradient id="glow" cx=".85" cy=".5" r=".6"><stop offset="0" stop-color="#fbbf24" stop-opacity=".28"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient></defs>
<rect width="1000" height="346" rx="18" fill="url(#bg)"/><rect width="1000" height="346" rx="18" fill="url(#glow)"/>
<circle cx="60" cy="40" r="3" fill="#fbbf24" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle>
<text x="48" y="64" font-size="14" letter-spacing="3" fill="#fbbf24" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700">DEVOPS BOOTCAMP · LAB</text>
<text x="48" y="112" font-size="40" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Terraform + Ansible: The</text>
<text x="48" y="160" font-size="40" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Handoff</text>
<text x="48" y="190" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">Terraform builds servers and stops caring. Ansible configures servers</text>
<text x="48" y="212" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">and has no idea where they are. Your job is the handoff between them,</text>
<text x="48" y="234" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">so that one person can destroy the servers and have the whole thing</text>
<text x="48" y="256" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">back, configured, with two commands and no edited IP address.</text>
<rect x="48" y="288" width="122" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".7"/><text x="62" y="309" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">105-120 min</text>
<rect x="182" y="288" width="268" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".7"/><text x="196" y="309" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Cost: free tier, a few cents</text>
<g transform="translate(750,73)">
<rect x="10" y="20" width="200" height="42" rx="6" fill="#111827" stroke="#fbbf24" stroke-opacity=".45"/>
<rect x="22" y="36" width="90" height="8" rx="4" fill="#374151"/>
<circle cx="150" cy="41" r="5" fill="#4ade80"><animate attributeName="opacity" values="1;.15;1" dur="1.10s" repeatCount="indefinite"/></circle>
<circle cx="168" cy="41" r="5" fill="#fbbf24"><animate attributeName="opacity" values="1;.15;1" dur="1.30s" repeatCount="indefinite"/></circle>
<circle cx="186" cy="41" r="5" fill="#f87171"><animate attributeName="opacity" values="1;.15;1" dur="1.50s" repeatCount="indefinite"/></circle>
<rect x="10" y="72" width="200" height="42" rx="6" fill="#111827" stroke="#fbbf24" stroke-opacity=".45"/>
<rect x="22" y="88" width="90" height="8" rx="4" fill="#374151"/>
<circle cx="150" cy="93" r="5" fill="#4ade80"><animate attributeName="opacity" values="1;.15;1" dur="1.45s" repeatCount="indefinite"/></circle>
<circle cx="168" cy="93" r="5" fill="#fbbf24"><animate attributeName="opacity" values="1;.15;1" dur="1.65s" repeatCount="indefinite"/></circle>
<circle cx="186" cy="93" r="5" fill="#f87171"><animate attributeName="opacity" values="1;.15;1" dur="1.85s" repeatCount="indefinite"/></circle>
<rect x="10" y="124" width="200" height="42" rx="6" fill="#111827" stroke="#fbbf24" stroke-opacity=".45"/>
<rect x="22" y="140" width="90" height="8" rx="4" fill="#374151"/>
<circle cx="150" cy="145" r="5" fill="#4ade80"><animate attributeName="opacity" values="1;.15;1" dur="1.80s" repeatCount="indefinite"/></circle>
<circle cx="168" cy="145" r="5" fill="#fbbf24"><animate attributeName="opacity" values="1;.15;1" dur="2.00s" repeatCount="indefinite"/></circle>
<circle cx="186" cy="145" r="5" fill="#f87171"><animate attributeName="opacity" values="1;.15;1" dur="2.20s" repeatCount="indefinite"/></circle>
<animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="4s" repeatCount="indefinite" additive="sum"/>
</g>
</svg>