#   - files/pollie_status.py copied to /opt/pollie/pollie_status.py (mode 0755)
#   - templates/status.json.j2 rendered to /opt/pollie/status.json
#   - files/pollie-status.service copied to /etc/systemd/system/, then systemd daemon_reload
#     (as a handler that also restarts the service)
#   - the service pollie-status enabled and started
